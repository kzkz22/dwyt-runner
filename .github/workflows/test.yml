name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install -e ".[test]"
      - run: uv run --no-sync ruff check --select F,E,W dwyt_runner tests tools
      - run: uv run --no-sync pytest -q
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install pip-audit pip
      - run: uv run --no-sync pip-audit .   # the project's own dependencies
