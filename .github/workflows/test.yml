name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install -e ".[test]"
      - name: pythonnet on Windows (the window icon is loaded with System.Drawing.Icon, as pywebview does)
        if: runner.os == 'Windows'
        run: uv pip install pythonnet
      - name: Windows reads the window icon (fails here, not on a user's machine)
        if: runner.os == 'Windows'
        run: uv run --no-sync python -c "import clr; clr.AddReference('System.Drawing'); from System.Drawing import Icon; from pathlib import Path; from dwyt_runner.app.logo import write_ico; i = Icon(str(write_ico(Path('ci-logo.ico')))); print('icon ok', i.Width, i.Height)"
      - run: uv run --no-sync ruff check --select F,E,W dwyt_runner tests tools packaging
      - run: uv run --no-sync pytest -q -rf --junitxml=pytest.xml
      - name: failures as annotations (readable without the log)
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          for case in ET.parse("pytest.xml").iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  text = ((bad.get("message") or "") + "\n" + (bad.text or ""))[-3000:]
                  print(f"::error title={case.get('name')}::" + text.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install pip-audit pip
      - run: uv run --no-sync pip-audit .   # the project's own dependencies
