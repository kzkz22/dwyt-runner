[project]
name = "dwyt-runner"
version = "0.6.0"
description = "dwyt runner: downloads, captions, cloud transcription and summaries on your own machine"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "yt-dlp[default,curl-cffi]",   # unpinned on purpose: YouTube changes often
  "imageio-ffmpeg>=0.5",         # a static ffmpeg for Linux, Windows and macOS
  "deno>=2.0",                   # the JavaScript runtime yt-dlp needs for YouTube
]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "ruff>=0.6"]

[project.scripts]
dwyt-runner = "dwyt_runner.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dwyt_runner*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"dwyt_runner/summarize.py" = ["E501"]  # prompt texts
"dwyt_runner/translate.py" = ["E501"]  # prompt texts

[tool.pytest.ini_options]
testpaths = ["tests"]
